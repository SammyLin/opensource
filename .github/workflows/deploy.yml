name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths: ["public/**", "wrangler.toml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-opensource-3mi
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: 782ea99a9b61fe5dcef072f99d341a85
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || 'manual deploy' }}
        run: |
          CLOUDFLARE_API_TOKEN=$(zsh -c 'source ~/.zshrc.local >/dev/null 2>&1; print -r -- $CLOUDFLARE_API_TOKEN')
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          export CLOUDFLARE_API_TOKEN
          npx --yes wrangler@4 pages deploy public --project-name opensource-3mi --branch main --commit-hash "$GITHUB_SHA" --commit-message "${COMMIT_MESSAGE%%$'\n'*}" --commit-dirty=false
