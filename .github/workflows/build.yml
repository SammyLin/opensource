name: Build static pages

# Regenerates the prerendered pages (public/index.html, public/zh-hans/, public/en/),
# sitemap.xml, robots.txt and the README program tables after changes land on main,
# so contributors who edit programs.json in the GitHub web editor don't need to run
# the build themselves. Cloudflare Pages then deploys the resulting commit.
on:
  push:
    branches:
      - main
    paths:
      - 'public/data/programs.json'
      - 'public/logos/**'
      - 'src/**'
      - 'build.js'
      - 'update-readme.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-static-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install build dependency
        run: npm install --no-save --no-package-lock jsdom@31

      - name: Validate data
        run: node validate.js

      - name: Prerender pages and update README
        run: |
          node build.js
          node update-readme.js

      - name: Commit generated files
        run: |
          if git diff --quiet; then
            echo "Generated files are up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add public README.md
          # No [skip ci] here: Cloudflare Pages honours it and would skip the deploy.
          # Pushes made with GITHUB_TOKEN don't trigger other workflows, so there is no loop.
          git commit -m "chore: regenerate static pages and README tables"
          git push
