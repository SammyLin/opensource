name: Validate Programs Data

on:
  pull_request:
    paths:
      - 'data/**'
      - 'lib/**'
      - 'scripts/**'
      - 'public/data/programs.json'
      - 'README.md'
      - 'public/logos/**'
      - 'src/**'
      - 'build.js'
      - 'validate.js'
  push:
    branches:
      - main
    paths:
      - 'data/**'
      - 'lib/**'
      - 'validate.js'

jobs:
  validate:
    # IMPORTANT: Must run on GitHub-hosted runner (NOT self-hosted)
    # for security on public repo accepting PRs from forks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Generated files are rebuilt on main after merge. When every PR regenerated them,
      # any two open PRs conflicted on them, so PRs must leave them alone.
      - name: Check that generated files are untouched
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if echo "$changed" | grep -qx 'public/data/programs.json'; then
            echo "::error file=public/data/programs.json::public/data/programs.json is generated from data/. Put the program in data/programs/<id>.json instead (branches using the old single file: run 'node scripts/split-programs.js', then 'git checkout origin/${{ github.base_ref }} -- public/data/programs.json')."
            exit 1
          fi
          base_tables=$(git show "origin/${{ github.base_ref }}:README.md" | sed -n '/<!-- programs:.*:start -->/,/<!-- programs:.*:end -->/p')
          head_tables=$(sed -n '/<!-- programs:.*:start -->/,/<!-- programs:.*:end -->/p' README.md)
          if [ "$base_tables" != "$head_tables" ]; then
            echo "::error file=README.md::The program tables in README.md are generated after merge. Please don't run 'npm run readme' in PRs: run 'git checkout origin/${{ github.base_ref }} -- README.md' (or undo only the table changes)."
            exit 1
          fi
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      
      - name: Run validation script
        run: node validate.js

      # Make sure the template still prerenders (every card renders in every language).
      # Generated files are committed by the "Build static pages" workflow after merge.
      - name: Check the pages build
        run: |
          npm install --no-save --no-package-lock jsdom@31
          node build.js
      
      - name: Validation passed
        if: success()
        run: echo "✅ All validations passed!"
