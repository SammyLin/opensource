        .pending { background: #eef2ff; color: #3730a3; border: 1px solid #c7d2fe; }

        .apply { display: inline-flex; gap: 6px; align-items: center; padding: 8px 14px; border-radius: var(--radius-md); background: var(--color-text); color: var(--color-surface); font-weight: 500; text-decoration: none; }

                'footer': 'Vendor sites are the source of truth. Double-check terms before applying.',
                'load-fail': 'Failed to load data',
                'license': 'Code <a href="https://github.com/SammyLin/opensource/blob/main/LICENSE" target="_blank" rel="noopener">MIT</a> · Data <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>', 'updated': 'Data updated', 'pending': 'To be confirmed', 'pending-src': 'Source'
            }
        };

        const lang = Object.keys(LANG_PATHS).find(l => l !== 'zh-Hant' && location.pathname.startsWith(LANG_PATHS[l])) || 'zh-Hant';
        const t = T[lang];
        const state = { q: '', type: '', cat: '' };
        let data = { categories: {}, programs: [] };

        // Data comes from public PRs: escape before inserting into HTML.
        const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const safeUrl = u => /^https?:\/\//.test(u) ? u : '#';
        const $ = s => document.querySelector(s);

        function applyStaticText() {
            document.documentElement.lang = lang;
            document.title = t.title;
            $('#meta-description').content = t.desc;
            $('#meta-og-title').content = t.title;
            $('#meta-og-description').content = t.desc;
            $('#canonical').href = 'https://opensource.3mi.ai' + LANG_PATHS[lang];
            document.querySelectorAll('[data-t]').forEach(el => el.textContent = t[el.dataset.t]);
            document.querySelectorAll('[data-t-html]').forEach(el => el.innerHTML = t[el.dataset.tHtml]);
            document.querySelectorAll('[data-t-placeholder]').forEach(el => el.placeholder = t[el.dataset.tPlaceholder]);
            document.querySelectorAll('.lang-switch a').forEach(a => {
                if (a.dataset.lang === lang) a.setAttribute('aria-current', 'page');
            });
            $('.logo').href = LANG_PATHS[lang];
        }

        function readState() {
            const p = new URLSearchParams(location.search);
            state.q = p.get('q') || '';
            state.type = TYPES.includes(p.get('type')) ? p.get('type') : '';
            const cat = LEGACY_CATS[p.get('cat')] || p.get('cat');
            state.cat = cat in data.categories ? cat : '';
            $('#q').value = state.q;
        }

        function writeState() {
            const p = new URLSearchParams();
            Object.entries(state).forEach(([k, v]) => v && p.set(k, v));
            const qs = p.toString() ? '?' + p : '';
            history.replaceState(null, '', location.pathname + qs);
            // keep filters when switching language
            document.querySelectorAll('.lang-switch a').forEach(a => a.href = LANG_PATHS[a.dataset.lang] + qs);
        }

        function matches(p, skip) {
            if (skip !== 'type' && state.type && p.type !== state.type) return false;
            if (skip !== 'cat' && state.cat && !p.category.includes(state.cat)) return false;
            if (state.q) {
                const hay = [p.name, p.whatYouGet[lang], p.whyItHelps?.[lang] || '', p.requirements[lang],
                    ...p.category.map(c => (data.categories[c]?.[lang] || c) + ' ' + cncfPath(c))].join(' ').toLowerCase();
                return state.q.toLowerCase().split(/\s+/).filter(Boolean).every(w => hay.includes(w));
            }
            return true;
        }

        // Counts on each chip reflect the other active filters, so users never click into an empty result.
        function chip(group, value, label, count) {
            const on = state[group] === value;
            return `<button class="chip" data-group="${group}" data-value="${esc(value)}" aria-pressed="${on}" ${count === 0 && !on ? 'disabled' : ''}>${esc(label)} <span class="n">${count}</span></button>`;
        }

        function renderChips() {
            const typePool = data.programs.filter(p => matches(p, 'type'));
            const catPool = data.programs.filter(p => matches(p, 'cat'));
            $('#type-row').innerHTML = `<span class="row-label">${esc(t['label-type'])}</span>` +
                chip('type', '', t.all, typePool.length) +
                TYPES.map(ty => chip('type', ty, t['type-' + ty], typePool.filter(p => p.type === ty).length)).join('');
            $('#cat-row').innerHTML = `<span class="row-label">${esc(t['label-cat'])}</span>` +
                chip('cat', '', t.all, catPool.length) +
                Object.keys(data.categories).map(c => chip('cat', c, data.categories[c][lang], catPool.filter(p => p.category.includes(c)).length)).join('');
        }

        // CNCF Landscape path, e.g. "Provisioning › Key Management"
        function cncfPath(c) {
            const x = data.categories[c]?.cncf;
            return x ? ['CNCF', x.category, x.subcategory].filter(Boolean).join(' › ') : '';
        }

        function renderCards() {
            const list = data.programs.filter(p => matches(p))
                .sort((a, b) => TYPES.indexOf(a.type) - TYPES.indexOf(b.type));
            $('#count').textContent = t.count(list.length);
            $('#clear').hidden = !(state.q || state.type || state.cat);
            $('#programs').innerHTML = list.length ? list.map(p => `
                <article class="card">
                    <div class="card-head">
                        ${p.logo ? `<span class="brand"><img src="${esc(p.logo)}" alt="" width="24" height="24" loading="lazy"></span>` : `<span class="brand mono" aria-hidden="true">${esc(p.name.charAt(0))}</span>`}
                        <h3><a href="${esc(safeUrl(p.link))}" target="_blank" rel="noopener">${esc(p.name)}</a></h3>
                    </div>
                    <div class="meta">
                        <span class="badge type-${esc(p.type)}">${esc(t['type-' + p.type])}</span>
                        ${p.pending ? `<span class="badge pending">${esc(p.pending[lang] || t.pending)}</span>` : ''}
                        ${p.category.map(c => `<span class="tag" title="${esc(cncfPath(c))}">${esc(data.categories[c]?.[lang] || c)}</span>`).join('')}
                    </div>
                    <dl>
                        ${p.whyItHelps ? `<div class="why-it-helps"><dt>${esc(t['why-it-helps'])}</dt><dd>${esc(p.whyItHelps[lang])}</dd></div>` : ''}
                        <div><dt>${esc(t['what-you-get'])}</dt><dd>${esc(p.whatYouGet[lang])}</dd></div>
                        <div><dt>${esc(t.requirements)}</dt><dd>${esc(p.requirements[lang])}${p.pending?.link ? ` <a href="${esc(safeUrl(p.pending.link))}" target="_blank" rel="noopener">${esc(t['pending-src'])}</a>` : ''}</dd></div>
                    </dl>
                    <div class="card-foot">
                        <a class="apply" href="${esc(safeUrl(p.link))}" target="_blank" rel="noopener">${esc(p.type === 'direct_activation' ? t['cta-direct'] : t['cta-apply'])}<svg class="icon"><use href="#i-ext"/></svg></a>
                        <span>${esc(t['last-verified'])} ${esc(p.lastVerified)}</span>
                    </div>
                </article>`).join('') : `<p class="empty">${esc(t.empty)}</p>`;
        }

        function render() { renderChips(); renderCards(); writeState(); }

        document.addEventListener('click', e => {
            const c = e.target.closest('.chip');
            if (c) { state[c.dataset.group] = state[c.dataset.group] === c.dataset.value ? '' : c.dataset.value; render(); }
        });
        $('#q').addEventListener('input', e => { state.q = e.target.value.trim(); render(); });
        $('#clear').addEventListener('click', () => { state.q = state.type = state.cat = ''; $('#q').value = ''; render(); });

        applyStaticText();
        fetch('/data/programs.json')
            .then(r => r.json())
            .then(d => {
                data = d;
                const latest = data.programs.map(p => p.lastVerified).sort().at(-1);
                if (latest) $('#updated').textContent = `${t.updated} ${latest}`;
                readState(); render();
            })
            .catch(err => {
                console.error(err);
                $('#programs').innerHTML = `<p class="empty">${esc(t['load-fail'])}</p>`;
            });
    </script>
</body>
</html>
