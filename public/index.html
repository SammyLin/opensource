        /* Hallmark · OSS Perks · trending-custom · F0 R0 */
        
        :root {
            --color-bg: #f8f9fa;
            --color-surface: #fdfefe;
            --color-text: #1a1a1a;
            --color-text-subtle: #555555;
            --color-text-muted: #757575;
            --color-border: #e5e7eb;
            --color-border-hover: #d1d5db;
            --color-accent: #10b981;
            --color-accent-dark: #059669;
            --color-focus: #0d9668;
            --color-badge-green-bg: #d1fae5;
            --color-badge-green-text: #065f46;
            --color-badge-yellow-bg: #fef3c7;
            --color-badge-yellow-text: #92400e;
            --color-badge-red-bg: #fee2e2;
            --color-badge-red-text: #991b1b;
            
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Noto Sans TC", Roboto, "Helvetica Neue", Arial, sans-serif;
            
            --radius-sm: 6px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-xl: 16px;
            --radius-full: 20px;
            
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
        }
        
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            overflow-x: clip;
        }

        body {
            font-family: var(--font-sans);
            line-height: 1.6;
            color: var(--color-text);
            background: var(--color-bg);
            scrollbar-color: var(--color-border-hover) var(--color-bg);
        }

        ::selection {
            background: var(--color-accent);
            color: var(--color-surface);
        }

        nav {
            background: var(--color-surface);
            border-bottom: 1px solid var(--color-border);
            padding: 16px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 18px;
            font-weight: 600;
            color: var(--color-text);
            text-decoration: none;
            white-space: nowrap;
        }

        .logo:focus-visible {
            outline: 2px solid var(--color-focus);
            outline-offset: 4px;
            border-radius: var(--radius-sm);
        }

        .lang-switch {
            display: flex;
            gap: 4px;
            background: var(--color-bg);
            padding: 4px;
            border-radius: var(--radius-full);
        }

        .lang-switch button {
            padding: 8px 16px;
            border: none;
            background: transparent;
            color: var(--color-text-subtle);
            cursor: pointer;
            border-radius: var(--radius-xl);
            font-size: 14px;
            min-height: 44px;
            transition: background 0.2s, color 0.2s;
            font-weight: 500;
        }

        .lang-switch button.active {
            background: var(--color-text);
            color: var(--color-surface);
        }

        .lang-switch button:hover:not(.active) {
            color: var(--color-text);
            background: var(--color-bg);
        }

        .lang-switch button:active {
            transform: translateY(1px);
        }

        .lang-switch button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .lang-switch button:focus-visible {
            outline: 2px solid var(--color-focus);
            outline-offset: 2px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        header {
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 48px;
            font-weight: 700;
            color: var(--color-text);
            margin-bottom: 12px;
            letter-spacing: -0.02em;
            text-wrap: balance;
        }

        header p {
            font-size: 16px;
            color: var(--color-text-subtle);
            margin-bottom: 4px;
        }

        .date-line {
            font-size: 14px;
            color: var(--color-text-muted);
        }

        .contribute-section {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-xl);
            padding: 48px;
            margin-bottom: 32px;
        }

        .contribute-section h2 {
            font-size: 32px;
            font-weight: 700;
            color: var(--color-text);
            margin-bottom: 32px;
            text-wrap: balance;
        }

        .steps {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin: 32px 0;
            flex-wrap: wrap;
        }

        .step {
            background: var(--color-bg);
            border: 1px solid var(--color-border);
            padding: 24px;
            border-radius: var(--radius-lg);
            flex: 1;
            min-width: 200px;
            max-width: 280px;
        }

        .step-number {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--color-accent);
            font-variant-numeric: tabular-nums;
        }

        .step h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--color-text);
        }

        .step p {
            font-size: 14px;
            color: var(--color-text-subtle);
        }

        .contribute-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .contribute-buttons a {
            display: inline-block;
            padding: 12px 24px;
            background: var(--color-text);
            color: var(--color-surface);
            text-decoration: none;
            border-radius: var(--radius-md);
            font-weight: 500;
            font-size: 14px;
            min-height: 44px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .contribute-buttons a:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .contribute-buttons a:active {
            transform: translateY(0);
        }

        .contribute-buttons a:focus-visible {
            outline: 2px solid var(--color-focus);
            outline-offset: 2px;
        }

        .filters {
            margin-bottom: 32px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .filter-btn {
            padding: 12px 24px;
            border: 1px solid var(--color-border);
            background: var(--color-surface);
            color: var(--color-text-subtle);
            cursor: pointer;
            border-radius: var(--radius-full);
            transition: border-color 0.2s, color 0.2s, background 0.2s;
            font-size: 14px;
            font-weight: 500;
            min-height: 44px;
        }

        .filter-btn:hover:not(.active) {
            border-color: var(--color-border-hover);
            color: var(--color-text);
            background: var(--color-bg);
        }

        .filter-btn.active {
            background: var(--color-text);
            color: var(--color-surface);
            border-color: var(--color-text);
        }

        .filter-btn:active {
            transform: translateY(1px);
        }

        .filter-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .filter-btn:focus-visible {
            outline: 2px solid var(--color-focus);
            outline-offset: 2px;
        }

        .programs {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 16px;
            margin-bottom: 40px;
        }

        .program-card {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: 24px;
            transition: box-shadow 0.2s, border-color 0.2s;
        }

        .program-card:hover {
            box-shadow: var(--shadow-md);
            border-color: var(--color-border-hover);
        }

        .program-card h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--color-text);
        }

        .type-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 12px;
        }

        .type-direct_activation {
            background: var(--color-badge-green-bg);
            color: var(--color-badge-green-text);
        }

        .type-application_required {
            background: var(--color-badge-yellow-bg);
            color: var(--color-badge-yellow-text);
        }

        .type-high_bar {
            background: var(--color-badge-red-bg);
            color: var(--color-badge-red-text);
        }

        .pending-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 500;
            margin-left: 8px;
            margin-bottom: 12px;
            background: #eef2ff;
            color: #3730a3;
            border: 1px solid #c7d2fe;
        }

        .pending-note {
            font-size: 13px;
            color: var(--color-text-muted);
            margin-bottom: 12px;
        }

        .pending-note a {
            color: var(--color-accent);
        }

        .categories {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }

        .category-tag {
            padding: 4px 8px;
            background: var(--color-bg);
            border-radius: var(--radius-sm);
            font-size: 11px;
            color: var(--color-text-subtle);
            font-weight: 500;
        }

        .program-card p {
            margin-bottom: 12px;
            font-size: 14px;
            color: var(--color-text-subtle);
            line-height: 1.5;
        }

        .program-card a {
            color: var(--color-accent);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .program-card a:hover {
            color: var(--color-accent-dark);
        }

        .program-card a:focus-visible {
            outline: 2px solid var(--color-focus);
            outline-offset: 2px;
            border-radius: var(--radius-sm);
        }

        .last-verified {
            font-size: 12px;
            color: var(--color-text-muted);
            margin-top: 8px;
        }

        footer {
            text-align: center;
            padding: 32px 0;
            margin-top: 48px;
            border-top: 1px solid var(--color-border);
        }

        footer a {
            color: var(--color-accent);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        footer a:hover {
            color: var(--color-accent-dark);
        }

        footer a:focus-visible {
            outline: 2px solid var(--color-focus);
            outline-offset: 2px;
            border-radius: var(--radius-sm);
        }

        footer p {
            color: var(--color-text-subtle);
            font-size: 14px;
        }

        .footer-license {
            margin-top: 12px;
            font-size: 13px;
            color: var(--color-text-muted);
        }

        .footer-license a {
            color: var(--color-text-subtle);
            text-decoration: underline;
            text-underline-offset: 2px;
            font-weight: 500;
        }

        .footer-license a:hover {
            color: var(--color-accent);
        }

        @media (max-width: 768px) {
            .nav-container {
                padding: 0 16px;
            }

            .logo {
                font-size: 16px;
            }

            .container {
                padding: 24px 16px;
            }

            header h1 {
                font-size: 32px;
            }

            header p {
                font-size: 14px;
            }

            .contribute-section {
                padding: 32px 24px;
            }

            .contribute-section h2 {
                font-size: 24px;
            }

            .steps {
                flex-direction: column;
                gap: 16px;
            }

            .step {
                max-width: 100%;
            }

            .programs {
                grid-template-columns: 1fr;
            }

            .filters {
                gap: 6px;
            }

            .filter-btn {
                font-size: 13px;
                padding: 6px 16px;
            }
        }

            <div class="contribute-buttons">

        </div>

        <footer>
            <p id="footer-contribute">

            </p>

                'official-link': 'Official Link',
                'last-verified': 'Last Verified',
                'pending-label': 'To be confirmed',
                'type-direct_activation': 'Direct Activation',
                'type-application_required': 'Application Required',
                'type-high_bar': 'High Bar',
                'cat-ide': 'IDE',
                'cat-containers': 'Containers',
                'cat-monitoring': 'Monitoring',
                'cat-security_scanning': 'Security Scanning',
                'cat-code_quality': 'Code Quality',
                'cat-password_management': 'Password Management',
                'cat-ai_tools': 'AI Tools'
            }
        };

        let currentLang = 'zh-Hant';
        let programsData = [];
        let currentFilter = 'all';
        let latestVerified = '';

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function getLatestVerified(programs) {
            return programs
                .map(p => p.lastVerified)
                .filter(Boolean)
                .sort()
                .at(-1) || '';
        }

        function switchLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-switch button').forEach(btn => {
                btn.classList.remove('active');
            });
            document.getElementById(`btn-${lang}`).classList.add('active');
            document.documentElement.lang = lang;
            
            const texts = translations[lang];
            document.title = texts['page-title'];
            document.getElementById('meta-description').content = texts['meta-description'];
            document.getElementById('meta-og-title').content = texts['page-title'];
            document.getElementById('meta-og-description').content = texts['meta-description'];
            document.getElementById('meta-og-site-name').content = texts['page-title'];
            document.getElementById('meta-twitter-title').content = texts['page-title'];
            document.getElementById('meta-twitter-description').content = texts['meta-description'];
            
            updateUIText();
            renderPrograms();
        }

        function updateUIText() {
            const texts = translations[currentLang];
            const skipIds = new Set(['footer-license-html', 'pending-label', 'page-title', 'meta-description', 'contribute-desc']);
            Object.keys(texts).forEach(id => {
                if (skipIds.has(id)) return;
                const el = document.getElementById(id);
                if (el) {
                    el.textContent = texts[id];
                }
            });

            document.getElementById('nav-logo').textContent = texts['page-title'];
            document.getElementById('footer-license').innerHTML = texts['footer-license-html'];
            const dateLine = document.getElementById('date-line');
            dateLine.textContent = latestVerified
                ? `${texts['last-verified']}: ${latestVerified}`
                : '';
        }

        function renderPrograms() {
            const container = document.getElementById('programs-container');
            const texts = translations[currentLang];
            
            let filtered = programsData;
            if (currentFilter !== 'all') {
                filtered = programsData.filter(p => p.category.includes(currentFilter));
            }

            container.innerHTML = filtered.map(program => {
                const pending = program.pending;
                const pendingBadge = pending
                    ? `<span class="pending-badge">${escapeHtml(pending[currentLang] || texts['pending-label'])}</span>`
                    : '';
                const pendingNote = pending && pending.link
                    ? `<p class="pending-note"><a href="${escapeHtml(pending.link)}" target="_blank" rel="noopener">${escapeHtml(texts['official-link'])}</a></p>`
                    : '';

                return `
                <div class="program-card">
                    <h3>${escapeHtml(program.name)}</h3>
                    <span class="type-badge type-${escapeHtml(program.type)}">${texts['type-' + program.type]}</span>
                    ${pendingBadge}
                    <div class="categories">
                        ${program.category.map(cat => `<span class="category-tag">${texts['cat-' + cat]}</span>`).join('')}
                    </div>
                    <p><strong>${texts['what-you-get']}:</strong> ${escapeHtml(program.whatYouGet[currentLang])}</p>
                    <p><strong>${texts['requirements']}:</strong> ${escapeHtml(program.requirements[currentLang])}</p>
                    ${pendingNote}
                    <p><a href="${escapeHtml(program.link)}" target="_blank" rel="noopener">${texts['official-link']}</a></p>
                    <p class="last-verified">${texts['last-verified']}: ${escapeHtml(program.lastVerified)}</p>
                </div>
            `;
            }).join('');
        }

        fetch('data/programs.json')
            .then(response => response.json())
            .then(data => {
                programsData = data;
                latestVerified = getLatestVerified(programsData);
                updateUIText();
                renderPrograms();
            })
            .catch(error => {
                console.error('Error loading programs:', error);
                document.getElementById('programs-container').innerHTML = '<p style="text-align:center;color:var(--color-text-muted);">Failed to load programs data</p>';
            });

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                currentFilter = e.target.dataset.category;
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                renderPrograms();
            });
        });

        updateUIText();
    </script>
</body>
</html>
